    <script src="8a3836f3-79a4-4ef7-97af-6770e67bea21"></script>
    <style>
        :root {
            --primary: #1e4d8b;
            --accent: #f59e0b;
            --bg: #f4f5f7;
            --surface: #ffffff;
            --ink: #18181b;
            --ink-soft: #6b7280;
            --line: #e5e7eb;
            --warn: #ef4444;
            --good: #10b981;
            --font: 'Heebo', system-ui, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0c0e14;
            --surface: #161922;
            --ink: #f4f4f5;
            --ink-soft: #9ca3af;
            --line: #2a2e38;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased
        }

        body {
            padding: 20px 12px 100px;
            min-height: 100vh
        }

        .page-wrap {
            max-width: 880px;
            margin: 0 auto
        }

        .doc {
            background: var(--surface);
            border-radius: 24px;
            padding: 32px 36px 40px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .04), 0 24px 60px -20px rgba(15, 23, 42, .18);
            border: 1px solid var(--line);
            position: relative
        }

        [contenteditable="true"]:hover {
            background: color-mix(in srgb, var(--primary) 6%, transparent);
            border-radius: 4px
        }

        [contenteditable="true"]:focus {
            outline: 2px dashed var(--primary);
            outline-offset: 3px;
            border-radius: 4px;
            background: transparent
        }

        .exporting [contenteditable]:hover,
        .exporting [contenteditable]:focus {
            outline: none !important;
            background: transparent !important
        }

        .exporting .no-export,
        .exporting .add-card,
        .exporting .add-vol-btn,
        .exporting .del,
        .exporting .del-row,
        .exporting .toolbar,
        .exporting .twk-panel,
        .exporting .hero-controls {
            display: none !important
        }

        /* Hero banner — wraps hero image with overlaid header. Breaks out of doc padding to be flush. */
        .hero-banner {
            position: relative;
            margin: -32px -36px 24px -36px;
            border-radius: 24px 24px 18px 18px;
            overflow: hidden;
            box-shadow: 0 8px 24px -12px rgba(15, 23, 42, .25)
        }

        .hero-banner .hero {
            margin-bottom: 0;
            border-radius: 0;
            border: 0;
            box-shadow: none
        }

        .hero-banner::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, .35) 0%, rgba(0, 0, 0, .1) 35%, rgba(0, 0, 0, .0) 60%, rgba(0, 0, 0, .15) 100%);
            pointer-events: none;
            z-index: 1
        }

        /* Header — overlay on hero. Use flex with space-between so logos stick to edges. */
        .doc-head-overlay {
            position: absolute;
            top: 0;
            inset-inline-start: 0;
            inset-inline-end: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding: 18px 24px;
            z-index: 3;
            border-bottom: 0;
            margin-bottom: 0;
            pointer-events: none
        }

        .doc-head-overlay .logo-slot {
            flex: 0 0 auto
        }

        .doc-head-overlay>* {
            pointer-events: auto
        }

        .doc-head-overlay .logo-slot {
            background: rgba(255, 255, 255, .92);
            border: 1.5px solid rgba(255, 255, 255, .7);
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .18)
        }

        .doc-head-overlay .logo-slot.has-img {
            background: rgba(255, 255, 255, .95)
        }

        /* Title overlay text — draggable, editable, positioned */
        .doc-title-overlay {
            position: absolute;
            z-index: 2;
            max-width: 70%;
            padding: 8px 14px;
            cursor: move;
            user-select: none
        }

        .doc-title-overlay:hover .title-controls {
            opacity: 1
        }

        .doc-title-overlay [contenteditable] {
            cursor: text;
            user-select: text
        }

        .doc-title-overlay .eyebrow {
            font-size: 12px;
            letter-spacing: .18em;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: inherit;
            opacity: .95
        }

        .doc-title-overlay .doc-title {
            font-size: 34px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -.01em;
            color: inherit
        }

        .doc-title-overlay .doc-subtitle {
            font-size: 14px;
            margin-top: 6px;
            font-weight: 500;
            color: inherit;
            opacity: .95;
            line-height: 1.4
        }

        .title-controls {
            position: absolute;
            top: -32px;
            inset-inline-end: 0;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity .15s;
            z-index: 4
        }

        .title-controls button {
            background: rgba(0, 0, 0, .7);
            color: #fff;
            border: 0;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .title-controls button:hover {
            background: rgba(0, 0, 0, .9)
        }

        /* Original header (kept for backward compat / fallback) */
        .doc-head {
            display: grid;
            grid-template-columns: 90px 1fr 90px;
            align-items: center;
            gap: 16px;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 22px
        }

        .logo-slot {
            width: 84px;
            height: 84px;
            border-radius: 14px;
            background: color-mix(in srgb, var(--primary) 5%, var(--surface));
            border: 1.5px dashed var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer
        }

        .logo-slot:hover {
            border-color: var(--primary)
        }

        .logo-slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px
        }

        .logo-slot.has-img {
            border-style: solid;
            border-color: var(--line);
            padding: 0
        }

        .logo-slot .ph {
            font-size: 11px;
            color: var(--ink-soft);
            font-weight: 600;
            text-align: center;
            padding: 4px;
            line-height: 1.3
        }

        .logo-slot input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer
        }

        .doc-title-wrap {
            text-align: center
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: .18em;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px
        }

        .doc-title {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -.01em
        }

        .doc-subtitle {
            font-size: 15px;
            color: var(--ink-soft);
            margin-top: 4px;
            font-weight: 500
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            aspect-ratio: 21/8;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 24px;
            background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 22%, var(--surface)), color-mix(in srgb, var(--accent) 18%, var(--surface)));
            border: 1px solid var(--line)
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .hero-empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--ink-soft);
            pointer-events: none
        }

        .hero-empty .icon {
            font-size: 32px;
            opacity: .55
        }

        .hero-empty span {
            font-size: 13px;
            font-weight: 600
        }

        .hero-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 6px;
            z-index: 2
        }

        .hero-controls button {
            background: rgba(0, 0, 0, .65);
            color: #fff;
            border: 0;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-family: inherit
        }

        .hero-controls button:hover {
            background: rgba(0, 0, 0, .85)
        }

        .hero-resize {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 14px;
            cursor: ns-resize;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 2;
            padding-bottom: 4px
        }

        .hero-resize-bar {
            width: 48px;
            height: 5px;
            border-radius: 3px;
            background: rgba(0, 0, 0, .45);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, .5);
            transition: all .15s
        }

        .hero-resize:hover .hero-resize-bar {
            background: rgba(0, 0, 0, .75);
            width: 64px
        }

        .hero {
            user-select: none;
            -webkit-user-select: none
        }

        .hero img {
            user-drag: none;
            -webkit-user-drag: none
        }

        /* Date strip */
        .date-strip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: color-mix(in srgb, var(--primary) 8%, var(--surface));
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            border-right: 4px solid var(--primary);
            flex-wrap: wrap
        }

        .date-strip .icon {
            font-size: 18px
        }

        .date-strip .label {
            color: var(--ink-soft);
            font-weight: 500
        }

        .date-strip .range {
            font-weight: 700;
            color: var(--ink);
            font-variant-numeric: tabular-nums
        }

        .date-strip .parasha {
            margin-inline-start: auto;
            padding: 5px 14px;
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700
        }

        /* Sections */
        .section {
            margin-bottom: 28px
        }

        .section-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px
        }

        .section-head h2 {
            font-size: 18px;
            font-weight: 800;
            margin: 0
        }

        .section-head .accent-bar {
            width: 4px;
            height: 22px;
            background: var(--primary);
            border-radius: 2px
        }

        /* Headline */
        .headline-stat {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 24px;
            align-items: center;
            padding: 26px 28px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 65%, #000));
            color: #fff;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden
        }

        .headline-stat::before {
            content: "";
            position: absolute;
            top: -40%;
            left: -10%;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(255, 255, 255, .18), transparent 70%);
            pointer-events: none
        }

        .headline-stat::after {
            content: "";
            position: absolute;
            bottom: -50%;
            right: -5%;
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(255, 255, 255, .10), transparent 70%);
            pointer-events: none
        }

        .headline-stat .big {
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            position: relative;
            z-index: 1;
            white-space: nowrap
        }

        .headline-stat .meta {
            position: relative;
            z-index: 1
        }

        .headline-stat .meta .t {
            font-size: 13px;
            opacity: .85;
            font-weight: 600;
            letter-spacing: .04em
        }

        .headline-stat .meta .s {
            font-size: 19px;
            font-weight: 700;
            margin-top: 4px;
            line-height: 1.3
        }

        /* Side stats */
        .side-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px
        }

        .side-stat {
            padding: 16px 18px;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px
        }

        .side-stat.alert {
            background: color-mix(in srgb, var(--warn) 8%, var(--surface));
            border-color: color-mix(in srgb, var(--warn) 30%, var(--line))
        }

        .side-stat.people {
            background: color-mix(in srgb, var(--good) 8%, var(--surface));
            border-color: color-mix(in srgb, var(--good) 30%, var(--line))
        }

        .side-stat .ico {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0
        }

        .side-stat.alert .ico {
            background: color-mix(in srgb, var(--warn) 18%, transparent)
        }

        .side-stat.people .ico {
            background: color-mix(in srgb, var(--good) 18%, transparent)
        }

        .side-stat .num {
            font-size: 28px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1
        }

        .side-stat .lbl {
            font-size: 13px;
            color: var(--ink-soft);
            font-weight: 600;
            margin-top: 4px
        }

        /* Stat grid */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            border-top: 4px solid var(--card-c, var(--primary))
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .15)
        }

        .stat-card .ico {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, var(--card-c, var(--primary)) 14%, transparent)
        }

        .stat-card .num {
            font-size: 30px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: var(--card-c, var(--primary))
        }

        .stat-card .lbl {
            font-size: 13px;
            color: var(--ink-soft);
            font-weight: 600
        }

        .stat-card .del {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 0;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
            opacity: 0;
            font-size: 14px
        }

        .stat-card:hover .del {
            opacity: 1
        }

        .stat-card .del:hover {
            background: color-mix(in srgb, var(--warn) 14%, transparent);
            color: var(--warn)
        }

        .stat-card .color-pick {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--surface);
            cursor: pointer;
            opacity: 0;
            box-shadow: 0 0 0 1px var(--line)
        }

        .stat-card:hover .color-pick {
            opacity: 1
        }

        .stat-card .color-pick input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            border-radius: 50%
        }

        .add-card {
            background: transparent;
            border: 1.5px dashed var(--line);
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            min-height: 120px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 14px;
            font-family: inherit;
            padding: 16px
        }

        .add-card:hover {
            border-color: var(--primary);
            color: var(--primary)
        }

        .add-card .plus {
            font-size: 24px;
            font-weight: 300
        }

        /* Champion */
        .champion {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 18px;
            align-items: center;
            padding: 22px 26px;
            border-radius: 20px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 1px solid #f59e0b40;
            position: relative;
            overflow: hidden
        }

        [data-theme="dark"] .champion {
            background: linear-gradient(135deg, #422006, #713f12);
            border-color: #f59e0b60;
            color: #fef3c7
        }

        .champion::before {
            content: "";
            position: absolute;
            bottom: -60px;
            right: -30px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(245, 158, 11, .25), transparent 70%);
            pointer-events: none
        }

        .trophy {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px -6px rgba(217, 119, 6, .55);
            flex-shrink: 0;
            position: relative;
            z-index: 1
        }

        .champion .label {
            font-size: 11px;

 < lines.length; i++) {        const line = lines[i].trim();        if (/סך\\s+הכל\\s+\\d+\\s+קריאות/.test(line)) { inSummary = true; continue; }        if (!inSummary) continue;        // Stop at "תודה" or empty section break        if (/^תודה/.test(line)) break;        // Stop when per-category breakdown begins (any "label:" header line, not "label - N")        if (/^[^\\d\\-–\]{2,30}:\\s*$/.test(line)) break;        if (/^רשימת/.test(line)) break;        const m = line.match(catLineRe);        if (m) {          const label = m[1].trim();          const count = parseInt(m[2], 10);          if (!isNaN(count) && label.length > 0 && label.length < 25) {            const meta = lookupCat(label);            categories.push({ id: 'c' + (categories.length + 1), label, count, ...meta });          }        }      }      if (categories.length > 0) {        result.categories = categories;        result.totalCalls = categories.reduce((s, c) => s + c.count, 0);      }      // Volunteers list — section "רשימת כל המתנדבים שיצאו לסייע:" followed by "name count" lines      const volIdx = text.indexOf('רשימת כל המתנדבים');      if (volIdx >= 0) {        const afterVol = text.slice(volIdx).split(/\\r?\/).slice(1);        const volunteers = [];        for (const raw of afterVol) {          const line = raw.trim();          if (!line) { if (volunteers.length > 0) break; else continue; }          if (/^עד כאן|^בברכה|^צוות/.test(line)) break;          // Match: "name 53" or "name - 53"          const m = line.match(/^(.+?)\\s+[-–]?\\s*(\\d+)\\s*$/);          if (m) {            const name = m[1].trim().replace(/\\s*[-–]\\s*$/, '');            const count = parseInt(m[2], 10);            if (name && !isNaN(count)) {              volunteers.push({ id: 'v' + (volunteers.length + 1), name, count });            }          }        }        if (volunteers.length > 0) {          result.volunteers = volunteers;          // Champion = top volunteer          const top = [...volunteers].sort((a, b ,categories,champion,volunteers').split(',');  const visMap = {    headline: t.showHeadline,    sideStats: (t.showActiveVolunteers || t.showEmergency),    categories: t.showCategories, champion: t.showChampion, volunteers: t.showVolunteers,    announcements: t.showAnnouncements  };  const renderSection = (key) => {    if (!visMap[key]) return null;    if (key === 'headline') return <HeadlineSection key={key} data={data} set={set} />;    if (key === 'sideStats') return <SideStatsSection key={key} data={data} set={set} showActive={t.showActiveVolunteers} showEmergency={t.showEmergency} />;    if (key === 'categories') return <CategoriesSection key={key} data={data} set={set} />;    if (key === 'champion') return <ChampionSection key={key} data={data} set={set} />;    if (key === 'volunteers') return <VolunteersSection key={key} data={data} set={set} />;    if (key === 'announcements') return <AnnouncementsSection key={key} data={data} set={set} />;    return null;  };  const moveSection = (key, dir) => {    const arr = sectionList.slice();    const i = arr.indexOf(key);    if (i < 0) return;    const j = i + dir;    if (j < 0 || j >= arr.length) return;    [arr[i], arr[j]] = [arr[j], arr[i]];    setTweak('sectionOrder', arr.join(','));  };  const sectionLabels = {    headline: 'סטטיסטיקה ראשית',    sideStats: 'סטטיסטיקות צד',    announcements: 'הודעות הנהלה',    categories: 'פילוח קטגוריות',    champion: 'מתנדב מצטיין',    volunteers: 'רשימת מתנדבים'  };  return (    <div className="page-wrap">      <div className="doc" id="doc-card">        <div className="hero-banner">          <Hero data={data} set={set} />          <header className="doc-head-overlay">            <LogoSlot src={data.orgLogo} onChange={(v) => set({ orgLogo: v })} placeholder="לוגו ידידים" />            <TitleOverlay data={data} set={set} />            <LogoSlot src={data.branchLogo} onChange={(v) => set({ branchLogo: v })} placeholder="לוגו הסניף" />          </header>        </div>        <div className="date-strip">          <span className="icon"><YIcon id="calendar" size={22} /></span>          <span className="label">לתאריכים:</span>          <span className="range"><E value={data.dateRange} onChange={(v) => set({ dateRange: v })} /></span>          <span className="parasha"><E value={data.parasha} onChange={(v) => set({ parasha: v })} /></span>        </div>        {sectionList.map(renderSection)}        <footer className="doc-foot">          <span><E value={data.footerNote} onChange={(v) => set({ footerNote: v })} /></span>          <span>תודה לכל המתנדבים <span className="heart">❤</span></span>        </footer>      </div>      <div className="toolbar no-export">        <button onClick={handleExportPNG}>📷 הורד תמונה</button>        <button onClick={handlePrint}>📄 הדפסה / PDF</button>        <button onClick={handleExportJSON}>💾 שמור JSON</button>        <button onClick={handleImportJSON}>📂 טען JSON</button>        <button onClick={handleImportEmail} style={{background:'#1e4d8b',color:'#fff',fontWeight:700}}>📧 ייבוא ממייל</button>        <button onClick={handleReset}>↺ איפוס</button>      </div>      <TweaksPanel>        <TweakSection label="מראה" />        <TweakColor label="צבע ראשי" value={t.primaryColor} onChange={(v) => setTweak('primaryColor', v)} />        <TweakColor label="צבע מותג" value={t.accentColor} onChange={(v) => setTweak('accentColor', v)} />        <TweakSelect label="פונט" value={t.fontFamily} options={['Heebo', 'Assistant', 'Rubik', 'Frank Ruhl Libre']} onChange={(v) => setTweak('fontFamily', v)} />        <TweakToggle label="מצב כהה" value={t.darkMode} onChange={(v) => setTweak('darkMode', v)} />        <TweakSection label="הצגת סקציות" />        <TweakToggle label="סטטיסטיקה ראשית" value={t.showHeadline} onChange={(v) => setTweak('showHeadline', v)} />        <TweakToggle label="מתנדבים פעילים" value={t.showActiveVolunteers} onChange={(v) => setTweak('showActiveVolunteers', v)} />        <TweakToggle label="קריאות חירום" value={t.showEmergency} onChange={(v) => setTweak('showEmergency', v)} />        <TweakToggle label="פילוח קטגוריות" value={t.showCategories} onChange={(v) => setTweak('showCategories', v)} />        <TweakToggle label="מתנדב מצטיין" value={t.showChampion} onChange={(v) => setTweak('showChampion', v)} />        <TweakToggle label="רשימת מתנדבים" value={t.showVolunteers} onChange={(v) => setTweak('showVolunteers', v)} />        <TweakToggle label="הודעות הנהלה" value={t.showAnnouncements} onChange={(v) => setTweak('showAnnouncements', v)} />        <TweakSection label="סדר סקציות" />        {sectionList.map((key, i) => (          <div key={key} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 0' }}>            <span style={{ flex: 1, fontSize: 12, fontWeight: 500 }}>{sectionLabels[key] || key}</span>            <button              onClick={() => moveSection(key, -1)}              disabled={i === 0}              style={{ width: 24, height: 24, border: '1px solid rgba(0,0,0,.1)', background: 'rgba(255,255,255,.7)', borderRadius: 6, cursor: i === 0 ? 'default' : 'pointer', opacity: i === 0 ? .3 : 1, fontSize: 11, padding: 0 }}            >▲</button>            <button              onClick={() => moveSection(key, 1)}              disabled={i === sectionList.length - 1}              style={{ width: 24, height: 24, border: '1px solid rgba(0,0,0,.1)', background: 'rgba(255,255,255,.7)', borderRadius: 6, cursor: i === sectionList.length - 1 ? 'default' : 'pointer', opacity: i === sectionList.length - 1 ? .3 : 1, fontSize: 11, padding: 0 }}            >▼</button>          </div>        ))}      </TweaksPanel>    </div>  );}ReactDOM.createRoot(document.getElementById('root')).render(<App />);  </script>
