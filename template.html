<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>סיכום שבועי - ידידים</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <script src="vendor/react.development.js"></script>
    <script src="vendor/react-dom.development.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script src="vendor/html2canvas.min.js"></script>

    <link rel="stylesheet" href="weekly-summary.css" />
    <link rel="stylesheet" href="settings-panel.css" />
  </head>
  <body>
    <div id="root"></div>
    <script
      type="text/babel"
      data-presets="env,react"
      src="settings-panel.js"
    ></script>
    <script
      type="text/babel"
      data-presets="env,react"
      src="report-icons.js"
    ></script>
    <script
      type="text/babel"
      data-presets="env,react"
      src="weekly-summary.js"
    ></script>

    <template id="email-import-template">
      <div
        style="
          background: #fff;
          border-radius: 16px;
          width: min(680px, 100%);
          max-height: 90vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        "
      >
        <div
          style="
            padding: 18px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <div>
            <div style="font-size: 18px; font-weight: 800">
              📧 ייבוא ממייל ספירה שבועית
            </div>
            <div style="font-size: 13px; color: #6b7280; margin-top: 4px">
              הדבק את תוכן המייל המלא והנתונים יחולצו אוטומטית
            </div>
          </div>
          <button
            id="emi-close"
            style="
              background: transparent;
              border: 0;
              font-size: 24px;
              cursor: pointer;
              color: #6b7280;
              padding: 4px 10px;
            "
          >
            ✕
          </button>
        </div>
        <textarea
          id="emi-input"
          placeholder="הדבק כאן את תוכן המייל (Ctrl+V)..."
          style="
            flex: 1;
            min-height: 320px;
            padding: 14px;
            border: 0;
            outline: 0;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            direction: rtl;
          "
        ></textarea>
        <div
          id="emi-preview"
          style="
            display: none;
            padding: 14px 22px;
            background: #f3f4f6;
            border-top: 1px solid #e5e7eb;
            max-height: 200px;
            overflow: auto;
            font-size: 13px;
          "
        ></div>
        <div
          style="
            padding: 14px 22px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
          "
        >
          <button
            id="emi-cancel"
            style="
              padding: 10px 18px;
              border: 1px solid #e5e7eb;
              background: #fff;
              border-radius: 8px;
              cursor: pointer;
              font-family: inherit;
              font-weight: 600;
            "
          >
            ביטול
          </button>
          <button
            id="emi-preview-btn"
            style="
              padding: 10px 18px;
              border: 1px solid #1e4d8b;
              background: #fff;
              color: #1e4d8b;
              border-radius: 8px;
              cursor: pointer;
              font-family: inherit;
              font-weight: 600;
            "
          >
            תצוגה מקדימה
          </button>
          <button
            id="emi-apply"
            style="
              padding: 10px 18px;
              border: 0;
              background: #1e4d8b;
              color: #fff;
              border-radius: 8px;
              cursor: pointer;
              font-family: inherit;
              font-weight: 700;
            "
          >
            החלת הנתונים
          </button>
        </div>
      </div>
    </template>
  </body>
</html>
